export default "<ion-header>\n  <ion-toolbar>\n    <ion-title>Offers</ion-title>\n    <ion-buttons slot=\"start\">\n      <ion-button shape=\"round\"  [routerLink]=\"['/quicktour']\">\n        <ion-icon color=\"light\" name=\"arrow-back-outline\"></ion-icon>\n      </ion-button>\n    </ion-buttons>\n  </ion-toolbar>\n</ion-header>\n\n<ion-content>\n  <div *ngIf=\"isOfferPresent\">\n  <ion-card *ngFor=\"let offer of offers\">\n    <ion-row class=\"card-row card-top-row\">\n      <ion-col size=\"12\" class=\"ion-text-center\">\n    <img src=\"{{offer.offerImg}}\" alt=\"\">\n      </ion-col>\n      <ion-col size=\"12\">\n        <p class=\"age\">{{offer.offer | titlecase}}</p>\n        <hr>\n        <ion-row class=\"data-row\">\n          <ion-col size=\"6\">\n            <p class=\"header\">Date</p>\n            <p class=\"value\">{{offer.offerFromDate}}</p>\n          </ion-col>\n          <ion-col size=\"6\" class=\"ion-text-end\">\n            <p class=\"header\">Date</p>\n            <p class=\"value\">{{offer.offerToDate}}</p>\n          </ion-col>\n        </ion-row>\n       \n      </ion-col>\n    </ion-row>\n  </ion-card>\n</div>\n<div *ngIf=\"!isOfferPresent\">\n  <ion-card  class=\"ion-text-start  data-card \" >\n    <ion-row>\n      <ion-col size=\"12\">\n        <p class=\"date\"><b>No Offers Added</b> </p>         \n      </ion-col>\n    </ion-row>\n  </ion-card>\n</div>\n</ion-content>\n";
