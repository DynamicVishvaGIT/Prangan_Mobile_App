export default "<ion-header>\n  <ion-toolbar>\n    <ion-title>Other Activities</ion-title>\n    <ion-buttons slot=\"start\">\n      <ion-button shape=\"round\"  [routerLink]=\"['/quicktour']\">\n        <ion-icon color=\"light\" name=\"arrow-back-outline\"></ion-icon>\n      </ion-button>\n    </ion-buttons>\n  </ion-toolbar>\n</ion-header>\n\n<ion-content>\n  <div *ngIf=\"isActivityPresent\">\n    <ion-card *ngFor=\"let activity of activities\">\n      <ion-row class=\"card-row card-top-row\">\n        <ion-col size=\"12\" class=\"ion-text-center\">\n          <img src=\"{{activity.activityImg}}\" alt=\"\">\n        </ion-col>\n        <ion-col size=\"12\">\n          <p class=\"age\">{{activity.activity | titlecase}}</p>\n        </ion-col>\n        <!-- <hr>\n          <ion-col size=\"12\">\n            {{}}\n          </ion-col> -->\n      </ion-row>\n    </ion-card>\n  </div>\n  <div *ngIf=\"!isActivityPresent\">\n    <ion-card  class=\"ion-text-start  data-card \" >\n      <ion-row>\n        <ion-col size=\"12\">\n          <p class=\"date\"><b>No Activity Added</b> </p>         \n        </ion-col>\n      </ion-row>\n    </ion-card>\n  </div>\n</ion-content>\n";
