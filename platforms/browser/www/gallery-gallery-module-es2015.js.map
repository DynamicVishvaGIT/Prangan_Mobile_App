export default "<ion-header>\n  <ion-toolbar>\n    \n    <ion-title>Gallery</ion-title>\n    <ion-buttons slot=\"start\">\n      <ion-button  shape=\"round\" (click)=\"goBack()\">\n        <ion-icon color=\"light\" name=\"arrow-back-outline\"></ion-icon>\n      </ion-button>\n    </ion-buttons>\n  </ion-toolbar>\n</ion-header>\n\n<ion-content>\n  <ion-refresher slot=\"fixed\" (ionRefresh)=\"doRefresh($event)\">\n    <ion-refresher-content></ion-refresher-content>\n  </ion-refresher>\n  <!-- <div class=\"padding-ionic\" *ngIf=\"type=='quicktour'\">\n  <ion-row >\n    <ion-col size=\"6\">\n      <ion-img src=\"../../assets/events/01.png\"></ion-img>\n    </ion-col>\n    <ion-col size=\"6\">\n      <ion-img src=\"../../assets/events/02.png\"></ion-img>\n    </ion-col>\n    <ion-col size=\"6\">\n      <ion-img src=\"../../assets/events/03.png\"></ion-img>\n    </ion-col>\n    <ion-col size=\"6\">\n      <ion-img src=\"../../assets/events/04.png\"></ion-img>\n    </ion-col>\n  </ion-row>\n</div> -->\n<div class=\"padding-ionic\" *ngIf=\"albums\">\n  <ion-card class=\"ion-text-center\" *ngFor=\"let album of albums\">\n    <img src=\"{{album.image}}\" alt=\"\">\n\n    <ion-row class=\"card-row card-top-row\">\n      <ion-col size=\"12\">\n        <p class=\"age\">{{album.name |titlecase}}</p>\n        <hr>\n        <ion-row class=\"data-row\">\n        </ion-row>\n        <ion-row  class=\"data-row\">\n          <ion-col size=\"12\">\n            <ion-button  shape=\"round\"(click)=\"openDetails2(album.id,album.name)\" size=\"small\" class=\"view-btn\" color=\"primary\"><p class=\"view-txt\">View</p></ion-button>\n          </ion-col>\n        </ion-row>\n      </ion-col>\n    </ion-row>\n  </ion-card>\n\n \n</div>\n<div class=\"margin-ionic homework-slider\" *ngIf=\"!isAlbumPresent\">\n  <ion-slides pager=\"false\" class=\"slider-card events-slider\"  >\n    <ion-slide>\n      <ion-card  class=\"ion-text-start  data-card w-100\" >\n        <ion-row>\n          <ion-col size=\"12\">\n            <p class=\"date\"><b>No Gallery</b> </p>         \n          </ion-col>\n         \n        </ion-row>\n       \n      </ion-card>\n    </ion-slide>\n  </ion-slides>\n</div>\n<div class=\"padding-ionic\" *ngIf=\"albums !='' && !isAlbumPresent\">\n  <ion-card class=\"ion-text-center\">\n <ion-skeleton-text animated style=\"width: 60%\"></ion-skeleton-text>\n\n    <ion-row class=\"card-row card-top-row\">\n      <ion-col size=\"12\">\n        <p class=\"age\"><ion-skeleton-text animated style=\"width: 40%\"></ion-skeleton-text></p>\n        <hr>\n        <ion-row class=\"data-row\">\n        </ion-row>\n        <ion-row  class=\"data-row\">\n          <ion-col size=\"12\">\n            <!-- <ion-button  shape=\"round\" size=\"small\" class=\"view-btn\" color=\"primary\"><p class=\"view-txt\">View</p></ion-button> -->\n          </ion-col>\n        </ion-row>\n      </ion-col>\n    </ion-row>\n  </ion-card>\n</div>\n</ion-content>\n";
