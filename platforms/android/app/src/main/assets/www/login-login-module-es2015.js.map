export default "<ion-content [fullscreen]=\"true\">\n  <div class=\"img-block\">\n  <img src=\"../../assets/logo/prangan-logo.png\" alt=\"\">\n  </div>\n  <div class=\"margin-ionic padding-ionic\">\n    <p>Log in with</p>\n    <ion-button  shape=\"round\"[routerLink]=\"['/mobilelogin']\"   expand=\"block\" color=\"primary\">\n      Mobile Number\n    </ion-button>\n    <br>\n    <p class=\"ion-text-center\">OR</p>\n    <br>\n\n    <ion-button  shape=\"round\"[routerLink]=\"['/addinquiry']\" expand=\"block\" color=\"primary\">\n      Enquiry Form\n    </ion-button>\n    <br>\n    <p>Admission Form</p>\n    <ion-row>\n      <ion-col size=\"6\">\n        <ion-button  shape=\"round\"[routerLink]=\"['/addadmission']\" expand=\"block\" color=\"primary\">\n         Daycare\n        </ion-button>\n      </ion-col>\n      <ion-col size=\"6\">\n        <ion-button  shape=\"round\"[routerLink]=\"['/preschoolform']\" expand=\"block\" color=\"secondary\">\n          Preschool\n        </ion-button>\n      </ion-col>\n    </ion-row>\n  </div>\n</ion-content>\n";
