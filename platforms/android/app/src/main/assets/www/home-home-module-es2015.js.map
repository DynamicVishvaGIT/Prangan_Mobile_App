export default "\n<ion-content [fullscreen]=\"true\">\n<div class=\"img-block\">\n<img src=\"../../assets/logo/prangan-logo.png\" alt=\"\">\n</div>\n  <ion-row class=\"app-icon-container\">\n    <ion-col class=\"ion-text-center ion-no-padding\">\n\n      <img src=\"../../assets/logo/login-2.png\" />      \n    </ion-col>\n  </ion-row>\n\n  <div id=\"container\" class=\"margin-ionic padding-ionic-start padding-ionic-end\">\n    <ion-button  shape=\"round\"class=\"tour-btn\" size=\"default\" (click)=\"openQuickTour()\"  fill=\"outline\" color=\"light\"   expand=\"block\" type=\"submit\">\n      <p class=\"tour-btn-text\">Quick Tour </p> \n    </ion-button>\n   <p class=\"ion-text-center or-txt\">OR</p>\n   <ion-button  shape=\"round\"class=\"login-btn\" (click)=\"openLogin()\"  expand=\"block\" fill=\"solid\"  color=\"primary\">\n    <p class=\"btn-text\">Login </p> \n\n  \n  </ion-button>\n  </div>\n</ion-content>\n";
