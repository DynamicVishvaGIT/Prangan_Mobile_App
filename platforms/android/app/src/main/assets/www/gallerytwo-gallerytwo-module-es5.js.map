export default "<ion-header>\n  <ion-toolbar>\n    <ion-title *ngIf=\"name\">{{name|titlecase}}</ion-title>\n    <ion-buttons slot=\"start\">\n      <ion-button  shape=\"round\"  (click)=\"goBack()\">\n        <ion-icon name=\"arrow-back-sharp\" color=\"light\"></ion-icon>\n      </ion-button>\n    </ion-buttons>\n  </ion-toolbar>\n</ion-header>\n\n<ion-content>\n  <ion-refresher slot=\"fixed\" (ionRefresh)=\"doRefresh($event)\">\n    <ion-refresher-content></ion-refresher-content>\n  </ion-refresher>\n  <div class=\"padding-ionic\" *ngIf=\"images\">\n    <ion-row >\n      <ion-col size=\"6\" *ngFor=\"let image of images\">\n        <ion-img *ngIf=\"image.image\" src=\"{{image.image}}\" (click)=\"viewImage(image.image)\"></ion-img>\n        <div class=\"frame-div\" *ngIf=\"image.video\">\n          <iframe class=\"responsive-iframe\" [src]=\"sanitizer.bypassSecurityTrustResourceUrl(image.video)\"  target=\"_parent\" allowfullscreen></iframe>\n        </div>\n        <br>\n        <ion-item (click)=\"download(image.image)\" *ngIf=\"image.image\">\n          <ion-icon name=\"download-outline\" ></ion-icon>\n          <ion-label>Download</ion-label>\n        </ion-item>\n      </ion-col>\n    </ion-row>\n  </div>\n</ion-content>\n";
