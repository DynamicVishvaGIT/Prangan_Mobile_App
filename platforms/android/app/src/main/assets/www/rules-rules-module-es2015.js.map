export default "<ion-header>\n  <ion-toolbar>\n    <ion-title>Rules & Regulations</ion-title>\n    <ion-buttons slot=\"start\">\n      <ion-button  shape=\"round\"[routerLink]=\"['/quicktour']\">\n        <ion-icon color=\"light\" name=\"arrow-back-outline\"></ion-icon>\n      </ion-button>\n    </ion-buttons>\n  </ion-toolbar>\n\n</ion-header>\n\n<ion-content>\n  <div >\n    <!-- <div *ngIf=\"isRulesAvailable\"> -->\n    <p *ngFor=\"let rule of rules\">\n      {{rule.rule}}\n    </p>\n  </div>\n  <div >\n    <!-- <div *ngIf=\"!isRulesAvailable\"> -->\n    <ion-card  class=\"ion-text-start  data-card \" >\n      <ion-row>\n        <ion-col size=\"12\">\n          <p class=\"date\"><b>No Rules Added</b> </p>         \n        </ion-col>\n      </ion-row>\n    </ion-card>\n  </div>\n</ion-content>\n";
