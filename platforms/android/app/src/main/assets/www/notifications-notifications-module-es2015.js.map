export default "<ion-header>\n  <ion-toolbar>\n    <ion-title>Notifications</ion-title>\n    <ion-buttons slot=\"start\">\n      <ion-button  shape=\"round\"[routerLink]=\"['/quicktour']\">\n        <ion-icon color=\"light\" name=\"arrow-back-outline\"></ion-icon>\n      </ion-button>\n    </ion-buttons>\n  </ion-toolbar>\n</ion-header>\n\n<ion-content>\n  <ion-refresher slot=\"fixed\" (ionRefresh)=\"doRefresh($event)\">\n    <ion-refresher-content></ion-refresher-content>\n  </ion-refresher>\n<div class=\"notification-div\" *ngIf=\"notifications\">\n  <ion-item *ngFor=\"let notification of notifications.slice().reverse();\">\n    <ion-icon slot=\"start\" name=\"notifications-outline\" color=\"primary\"></ion-icon>\n    <ion-label>{{notification.comment}}</ion-label>\n  </ion-item>\n</div>\n<div class=\"notification-div\" *ngIf=\"!notifications && notifications!==''\">\n  <ion-item >\n    <ion-icon slot=\"start\" name=\"notifications-outline\" color=\"primary\"></ion-icon>\n    <ion-label><ion-skeleton-text animated style=\"width: 50%\"></ion-skeleton-text></ion-label>\n  </ion-item>\n  <ion-item >\n    <ion-icon slot=\"start\" name=\"notifications-outline\" color=\"primary\"></ion-icon>\n    <ion-label><ion-skeleton-text animated style=\"width: 50%\"></ion-skeleton-text></ion-label>\n  </ion-item>\n  <ion-item >\n    <ion-icon slot=\"start\" name=\"notifications-outline\" color=\"primary\"></ion-icon>\n    <ion-label><ion-skeleton-text animated style=\"width: 50%\"></ion-skeleton-text></ion-label>\n  </ion-item>\n</div>\n<div class=\"notification-div\" *ngIf=\"notifications==''\">\n    <div class=\"ion-text-center empty-div\">\n      <ion-label >No Notifications</ion-label>\n    </div>\n</div>\n</ion-content>\n";
