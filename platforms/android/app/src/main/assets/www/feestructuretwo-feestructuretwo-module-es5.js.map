export default "<ion-header>\n  <ion-toolbar>\n    <ion-title *ngIf=\"branch_name\">{{branch_name|titlecase}} Fees Structure</ion-title>\n    <ion-buttons slot=\"start\">\n      <ion-button  shape=\"round\"[routerLink]=\"['/feestructure']\">\n        <ion-icon color=\"light\" name=\"arrow-back-outline\"></ion-icon>\n      </ion-button>\n    </ion-buttons>\n  </ion-toolbar>\n</ion-header>\n\n<ion-content>\n<div class=\"padding-ionic\" *ngIf=\"columns\">\n  <!-- <ion-card mode=\"ios\" > -->\n   <br>\n  \n\n  <ion-card mode=\"ios\" *ngFor=\"let column of columns\">\n    <p class=\"heading\"><b>{{column.name|titlecase}}</b></p>\n    <ion-row>\n      <ion-col size=\"6\" *ngFor=\"let row of filtered_row\">\n        <p class=\"header\">{{row.name}} : </p>\n        <span *ngFor=\"let item of row.amount_arary\">\n          <p class=\"p-margin\" *ngIf=\"item.column_id==column.id\">₹ {{item.amount}}</p>\n         \n        </span>\n      </ion-col>\n    </ion-row>\n   <br>\n    <div class=\"ion-text-center\">\n      <ion-button  shape=\"round\" size=\"default\" class=\"view-btn\" color=\"primary\" (click)=\"openPdf()\" >View PDF</ion-button>\n\n    </div>\n  </ion-card>\n   \n\n</div>\n</ion-content>\n";
