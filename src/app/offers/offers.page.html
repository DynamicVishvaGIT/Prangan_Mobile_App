<ion-header>
  <ion-toolbar>
    <ion-title>Offers</ion-title>
    <ion-buttons slot="start">
      <ion-button shape="round"  [routerLink]="['/quicktour']">
        <ion-icon color="light" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div *ngIf="isOfferPresent">
  <ion-card *ngFor="let offer of offers">
    <ion-row class="card-row card-top-row">
      <ion-col size="12" class="ion-text-center">
    <img src="{{offer.offerImg}}" alt="">
      </ion-col>
      <ion-col size="12">
        <p class="age">{{offer.offer | titlecase}}</p>
        <hr>
        <ion-row class="data-row">
          <ion-col size="6">
            <p class="header">Date</p>
            <p class="value">{{offer.offerFromDate}}</p>
          </ion-col>
          <ion-col size="6" class="ion-text-end">
            <p class="header">Date</p>
            <p class="value">{{offer.offerToDate}}</p>
          </ion-col>
        </ion-row>
       
      </ion-col>
    </ion-row>
  </ion-card>
</div>
<div *ngIf="!isOfferPresent">
  <ion-card  class="ion-text-start  data-card " >
    <ion-row>
      <ion-col size="12">
        <p class="date"><b>No Offers Added</b> </p>         
      </ion-col>
    </ion-row>
  </ion-card>
</div>
</ion-content>
