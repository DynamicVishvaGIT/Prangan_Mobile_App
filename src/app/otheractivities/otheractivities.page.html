<ion-header>
  <ion-toolbar>
    <ion-title>Other Activities</ion-title>
    <ion-buttons slot="start">
      <ion-button shape="round"  [routerLink]="['/quicktour']">
        <ion-icon color="light" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div *ngIf="isActivityPresent">
    <ion-card *ngFor="let activity of activities">
      <ion-row class="card-row card-top-row">
        <ion-col size="12" class="ion-text-center">
          <img src="{{activity.activityImg}}" alt="">
        </ion-col>
        <ion-col size="12">
          <p class="age">{{activity.activity | titlecase}}</p>
        </ion-col>
        <!-- <hr>
          <ion-col size="12">
            {{}}
          </ion-col> -->
      </ion-row>
    </ion-card>
  </div>
  <div *ngIf="!isActivityPresent">
    <ion-card  class="ion-text-start  data-card " >
      <ion-row>
        <ion-col size="12">
          <p class="date"><b>No Activity Added</b> </p>         
        </ion-col>
      </ion-row>
    </ion-card>
  </div>
</ion-content>
