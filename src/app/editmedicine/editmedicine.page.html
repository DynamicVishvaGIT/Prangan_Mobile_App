<ion-header>
  <ion-toolbar>
    <ion-title>Edit Medicine</ion-title>
    <ion-buttons slot="start">
      <ion-button shape="round" (click)="closeModal()">
        <ion-icon color="light" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div *ngIf="editMedicineForm">
  <form [formGroup]="editMedicineForm" (ngSubmit)="onSubmit(editMedicineForm.value)">
    <ion-row>
     
      <ion-col size="12">
        <ion-label>Medicine Name</ion-label>
        <ion-item lines="none">
          <ion-input formControlName="tab" type="text" ></ion-input>
        </ion-item>
      </ion-col>
    </ion-row>
    <ion-row>
     
      <ion-col size="3">
        <ion-label>Morning Time</ion-label>
      </ion-col>
      <ion-col size="9">
        <ion-item lines="none">
        <ion-datetime displayFormat="h:mm a" formControlName="morningTime"></ion-datetime>
        </ion-item>
      </ion-col>
      
    </ion-row>
    <ion-row>
     
      <ion-col size="3">
        <ion-label>Afternoon Time</ion-label>
      </ion-col>
      <ion-col size="9">
        <ion-item lines="none">
        <ion-datetime displayFormat="h:mm a" formControlName="afternoonTime"></ion-datetime>
  
        </ion-item>
      </ion-col>
      
    </ion-row>
    <ion-row>
     
      <ion-col size="3">
        <ion-label>Evening Time</ion-label>
      </ion-col>
      <ion-col size="9">
        <ion-item lines="none">
        <ion-datetime displayFormat="h:mm a" formControlName="eveningTime"></ion-datetime>
        </ion-item>
      </ion-col>
      
    </ion-row>
    <ion-row>
      <ion-col size="6">
        <ion-label>Quantity </ion-label>
        <ion-item lines="none">
          <ion-input type="number" formControlName="quantity"></ion-input>
          </ion-item>
      </ion-col>
      <ion-col size="6">
        <ion-label>Comment </ion-label>
        <ion-item lines="none">
          <ion-input type="text" formControlName="comment"></ion-input>
          </ion-item>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="12" class="ion-text-center">
          <ion-button [disabled]="editMedicineForm.invalid" shape="round" type="submit"  color="secondary">
            Submit
          </ion-button>
      </ion-col>
    </ion-row>
  </form>
</div>
</ion-content>
