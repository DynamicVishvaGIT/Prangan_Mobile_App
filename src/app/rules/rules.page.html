<ion-header>
  <ion-toolbar>
    <ion-title>Rules & Regulations</ion-title>
    <ion-buttons slot="start">
      <ion-button  shape="round"[routerLink]="['/quicktour']">
        <ion-icon color="light" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

</ion-header>

<ion-content>
  <div >
    <!-- <div *ngIf="isRulesAvailable"> -->
    <p *ngFor="let rule of rules">
      {{rule.rule}}
    </p>
  </div>
  <div >
    <!-- <div *ngIf="!isRulesAvailable"> -->
    <ion-card  class="ion-text-start  data-card " >
      <ion-row>
        <ion-col size="12">
          <p class="date"><b>No Rules Added</b> </p>         
        </ion-col>
      </ion-row>
    </ion-card>
  </div>
</ion-content>
