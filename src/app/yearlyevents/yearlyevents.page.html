<ion-header>
  <ion-toolbar>
    <ion-title>Yearly Events</ion-title>
    <ion-buttons slot="start">
      <ion-button shape="round"  [routerLink]="['/quicktour']">
        <ion-icon color="light" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>

  <p class="month">January 2022</p>  
  <ion-card>
    <p class="schedule_heading">Makar Sankranti</p>
    <p>Date : 14-01-2022</p>
  </ion-card>  
  <ion-card>
    <p class="schedule_heading">Republic Day</p>
    <p>Date : 26-01-2022</p>
  </ion-card>  
 <hr>
  <p class="month">February 2022</p>  
  <ion-card>
    <p class="schedule_heading">Shivaji Jayanti</p>
    <p>Date : 19-02-2022</p>
  </ion-card>  
 <hr>
  <p class="month">March 2022</p>  
  <ion-card>
    <p class="schedule_heading">Mahashivratri</p>
    <p>Date : 01-03-2022</p>
  </ion-card>  
  <ion-card>
    <p class="schedule_heading">Holi</p>
    <p>Date : 18-03-2022</p>
  </ion-card>  
 <hr>
  
</ion-content>
