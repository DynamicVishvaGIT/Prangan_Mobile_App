<ion-header>
  <ion-toolbar>
    <ion-title>Illness</ion-title>
    <ion-buttons slot="start">
      <ion-button shape="round"  [routerLink]="['/quicktour']">
        <ion-icon color="light" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>
  <div class="padding-ionic" *ngIf="illness?.length>0">
    <ion-card  *ngFor="let illness_obj of illness">
      <ion-row class="card-row card-top-row" [routerLink]="['/addmedicine',illness_obj.illnessId]" >
      <ion-col size="12">
        <ion-label class="heading">Duration</ion-label>
      </ion-col>
     
      </ion-row>
      <ion-row class="card-row card-top-row" [routerLink]="['/addmedicine',illness_obj.illnessId]">
      <ion-col size="6">
        <p class="heading">From Date</p>
        <p class="heading">To Date</p>
      </ion-col>
      <ion-col size="6" class="ion-text-start">
        <p >{{illness_obj.fromDate}}</p>
        <p >{{illness_obj.toDate}}</p>
      </ion-col>
      </ion-row>
      <hr>
      <ion-row class="card-row card-top-row" [routerLink]="['/addmedicine',illness_obj.illnessId]">
        <ion-col size="6">
          <ion-label class="heading">Sickness & Illness</ion-label>
        </ion-col>
        <ion-col size="6" class="ion-text-start">
          <ion-label>{{illness_obj.illnessName |titlecase }}</ion-label>
        </ion-col>
        </ion-row>
        <hr>
        <ion-row class="card-row card-top-row" [routerLink]="['/addmedicine',illness_obj.illnessId]">
          <ion-col size="6">
            <ion-label class="heading">Prescription</ion-label>
          </ion-col>
          <ion-col size="6">
            <ion-label class="heading">
              <ion-button size="small" (click)="openPrescription(illness_obj.prescriptionImg)" color="primary" shape="round">
                View Prescription
              </ion-button>
            </ion-label>
          </ion-col>
          </ion-row>
       
          <hr>
          <ion-row class="card-row card-top-row">
            <ion-col size="12">
              <ion-row>
                <ion-col size="4" class="ion-text-center restrict_div" (click)="discontinueMedicines(illness_obj.illnessId)">
                  <img src="../../assets/medicine/restriction-ends2.png" alt="">
                </ion-col>
                <ion-col size="4" class="ion-text-center edit_div" (click)="openEditIllness(illness_obj)">
                  <img src="../../assets/medicine/pencil2.png" alt="">
                </ion-col>
                <ion-col size="4" class="ion-text-center delete_div" (click)="presentdeleteIllnessAlert(illness_obj.illnessId)">
                  <img src="../../assets/medicine/delete2.png" alt="">
                </ion-col>
              </ion-row>
              
            </ion-col>
            </ion-row>
    </ion-card>
    <br>

    <br>
  </div>
  <div *ngIf="illness?.length==0">
    <ion-card  class="ion-text-start  data-card " >
      <ion-row>
        <ion-col size="12">
          <p class="date"><b>No Illness Added</b> </p>         
        </ion-col>
      </ion-row>
    </ion-card>
  </div>
</ion-content>
<ion-fab vertical="bottom" horizontal="end" slot="fixed">
  <ion-fab-button>
    <!-- <ion-fab-button (click)="openAddIllness()"> -->
    <ion-icon color="light" name="add-sharp"></ion-icon>
  </ion-fab-button>
</ion-fab>
