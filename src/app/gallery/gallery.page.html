<ion-header>
  <ion-toolbar>

    <ion-buttons slot="start">

        <ion-icon color="light" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content></ion-refresher-content>

<div class="padding-ionic" *ngIf="albums">
  <ion-card class="ion-text-center" *ngFor="let album of albums">
    <img src="{{album.image}}" alt="">

    <ion-row class="card-row card-top-row">
      <ion-col size="12">
        <p class="age">{{album.name |titlecase}}</p>
        <hr>
        <ion-row class="data-row">
        </ion-row>
        <ion-row  class="data-row">
          <ion-col size="12">
            <ion-button  shape="round"(click)="openDetails2(album.id,album.name)" size="small" class="view-btn" color="primary"><p class="view-txt">View</p></ion-button>
          </ion-col>
        </ion-row>
      </ion-col>
    </ion-row>
  </ion-card>

 
</div>
<div class="margin-ionic homework-slider" *ngIf="!isAlbumPresent">
  <ion-slides pager="false" class="slider-card events-slider"  >
    <ion-slide>
      <ion-card  class="ion-text-start  data-card w-100" >
        <ion-row>
          <ion-col size="12">
            <p class="date"><b>No Gallery</b> </p>         
          </ion-col>
         
        </ion-row>
       
      </ion-card>
    </ion-slide>
  </ion-slides>
</div>
<div class="padding-ionic" *ngIf="albums !='' && !isAlbumPresent">
  <ion-card class="ion-text-center">
 <ion-skeleton-text animated style="width: 60%"></ion-skeleton-text>

    <ion-row class="card-row card-top-row">
      <ion-col size="12">
        <p class="age"><ion-skeleton-text animated style="width: 40%"></ion-skeleton-text></p>
        <hr>
        <ion-row class="data-row">
        </ion-row>
        <ion-row  class="data-row">
          <ion-col size="12">
            <!-- <ion-button  shape="round" size="small" class="view-btn" color="primary"><p class="view-txt">View</p></ion-button> -->
          </ion-col>
        </ion-row>
      </ion-col>
    </ion-row>
  </ion-card>
</div>
</ion-content>
