<ion-header>
  <ion-toolbar>
    <ion-title>Notice</ion-title>
    <ion-buttons slot="start">
      <ion-button shape="round"  [routerLink]="['/quicktour']">
        <ion-icon color="light" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>
  <div *ngIf="isNoticePresent">
  <ion-card *ngFor="let notice of notices">
    <ion-row class="card-row card-top-row">
      <ion-col size="12" class="ion-text-center">
    <img src="{{notice.image}}" alt="">
      </ion-col>
      <ion-col size="12">
        <p class="age">{{notice.title}}</p>
        <hr>
        <ion-row class="data-row">
          <ion-col size="12">
            {{notice.date}}
          </ion-col>
        </ion-row>
        <hr>
        <ion-row  class="data-row">
          <ion-col size="12">
           {{notice.description}}
          </ion-col>
        </ion-row>
      </ion-col>
    </ion-row>
  </ion-card>
</div>
<div *ngIf="!isNoticePresent">
  <ion-card  class="ion-text-start  data-card " >
    <ion-row>
      <ion-col size="12">
        <p class="date"><b>No Notice Added</b> </p>         
      </ion-col>
     
    </ion-row>
   
  </ion-card>
</div>
</ion-content>
