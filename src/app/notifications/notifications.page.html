<ion-header>
  <ion-toolbar>
    <ion-title>Notifications</ion-title>
    <ion-buttons slot="start">
      <ion-button  shape="round"[routerLink]="['/quicktour']">
        <ion-icon color="light" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>
<div class="notification-div" *ngIf="notifications">
  <ion-item *ngFor="let notification of notifications.slice().reverse();">
    <ion-icon slot="start" name="notifications-outline" color="primary"></ion-icon>
    <ion-label>{{notification.comment}}</ion-label>
  </ion-item>
</div>
<div class="notification-div" *ngIf="!notifications && notifications!==''">
  <ion-item >
    <ion-icon slot="start" name="notifications-outline" color="primary"></ion-icon>
    <ion-label><ion-skeleton-text animated style="width: 50%"></ion-skeleton-text></ion-label>
  </ion-item>
  <ion-item >
    <ion-icon slot="start" name="notifications-outline" color="primary"></ion-icon>
    <ion-label><ion-skeleton-text animated style="width: 50%"></ion-skeleton-text></ion-label>
  </ion-item>
  <ion-item >
    <ion-icon slot="start" name="notifications-outline" color="primary"></ion-icon>
    <ion-label><ion-skeleton-text animated style="width: 50%"></ion-skeleton-text></ion-label>
  </ion-item>
</div>
<div class="notification-div" *ngIf="notifications==''">
    <div class="ion-text-center empty-div">
      <ion-label >No Notifications</ion-label>
    </div>
</div>
</ion-content>
